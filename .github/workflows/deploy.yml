name: Deploy to Hetzner

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  # Where the site lives on the server. Caddy serves $SITE_ROOT/current.
  SITE_ROOT: /var/www/sumanyuj.com
  KEEP_RELEASES: 5

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Pin the host key so a hijacked DNS record can't MITM the deploy.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host hetzner
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify SSH login
        run: ssh -o BatchMode=yes hetzner 'echo "SSH OK on $(hostname -f) as $(whoami)"'

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="${SITE_ROOT}/releases/${GITHUB_SHA}"
          ssh hetzner "mkdir -p '${SITE_ROOT}/releases'"

          # --link-dest hardlinks unchanged files against the live release, so
          # each deploy costs only the bytes that actually changed.
          rsync -az --delete --delete-delay \
            --link-dest="${SITE_ROOT}/current/" \
            ./dist/ "hetzner:${RELEASE}/"

      - name: Activate release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="${SITE_ROOT}/releases/${GITHUB_SHA}"
          ssh hetzner bash -euo pipefail <<EOF
            test -f '${RELEASE}/index.html' || { echo "index.html missing in release"; exit 1; }

            # ln -T + mv -T swaps the symlink atomically: no request ever sees
            # a half-written document root.
            ln -sfnT '${RELEASE}' '${SITE_ROOT}/current.tmp'
            mv -T '${SITE_ROOT}/current.tmp' '${SITE_ROOT}/current'

            cd '${SITE_ROOT}/releases'
            live=\$(basename "\$(readlink -f '${SITE_ROOT}/current')")
            ls -1dt */ | sed 's#/\$##' | tail -n +$((KEEP_RELEASES + 1)) \\
              | grep -vxF "\$live" | xargs -r rm -rf --
            echo "Live: \$live"
          EOF

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 https://sumanyuj.com/)
          echo "GET https://sumanyuj.com/ -> $code"
          [ "$code" = "200" ]

name: Deploy to Hetzner

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  # Where the site lives on the server. Caddy serves $SITE_ROOT/current.
  SITE_ROOT: /var/www/sumanyuj.com
  # The API, deployed the same way but well outside the web root — under it,
  # Caddy would happily serve the service's own source as text.
  API_ROOT: /opt/bookshelf
  KEEP_RELEASES: 5

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Pin the host key so a hijacked DNS record can't MITM the deploy.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host hetzner
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify SSH login
        run: ssh -o BatchMode=yes hetzner 'echo "SSH OK on $(hostname -f) as $(whoami)"'

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="${SITE_ROOT}/releases/${GITHUB_SHA}"
          ssh hetzner "mkdir -p '${SITE_ROOT}/releases'"

          # --link-dest hardlinks unchanged files against the live release, so
          # each deploy costs only the bytes that actually changed.
          rsync -az --delete --delete-delay \
            --link-dest="${SITE_ROOT}/current/" \
            ./dist/ "hetzner:${RELEASE}/"

      - name: Activate release
        shell: bash
        run: |
          set -euo pipefail
          # Values go over as positional args with a quoted heredoc, so nothing
          # is ambiguously expanded on the runner instead of the server.
          ssh hetzner bash -euo pipefail -s -- \
            "$SITE_ROOT" "$GITHUB_SHA" "$KEEP_RELEASES" <<'REMOTE'
            site_root=$1; sha=$2; keep=$3
            release="$site_root/releases/$sha"

            test -f "$release/index.html" || {
              echo "index.html missing in $release" >&2; exit 1; }

            # ln -T + mv -T swaps the symlink atomically: no request ever sees
            # a half-written document root.
            ln -sfnT "$release" "$site_root/current.tmp"
            mv -T "$site_root/current.tmp" "$site_root/current"

            live=$(basename "$(readlink -f "$site_root/current")")
            echo "Live: $live"

            # grep exits 1 when it selects nothing, which is the normal case
            # below the keep threshold. Under pipefail that would fail the
            # deploy after the site had already been switched over, so the
            # empty result is handled rather than propagated.
            cd "$site_root/releases"
            stale=$(ls -1dt */ | sed 's#/$##' | tail -n "+$((keep + 1))" \
              | grep -vxF "$live" || true)
            if [ -n "$stale" ]; then
              echo "Pruning:"; printf '  %s\n' $stale
              printf '%s\n' "$stale" | xargs rm -rf --
            fi
          REMOTE

      - name: Deploy the API
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="${API_ROOT}/releases/${GITHUB_SHA}"
          ssh hetzner "mkdir -p '${API_ROOT}/releases'"

          # No node_modules: the service is Node builtins only, so this is a
          # few files and needs nothing installed on the server.
          rsync -az --delete --link-dest="${API_ROOT}/current/" ./server/ "hetzner:${RELEASE}/"

          ssh hetzner bash -euo pipefail -s -- "$API_ROOT" "$GITHUB_SHA" "$KEEP_RELEASES" <<'REMOTE'
            api_root=$1; sha=$2; keep=$3
            release="$api_root/releases/$sha"

            test -f "$release/index.js" || { echo "index.js missing in $release" >&2; exit 1; }

            ln -sfnT "$release" "$api_root/current.tmp"
            mv -T "$api_root/current.tmp" "$api_root/current"

            sudo systemctl restart bookshelf-api

            # Fail the deploy rather than leave a dead API behind a live site.
            for i in $(seq 1 20); do
              if curl -fsS --max-time 2 http://127.0.0.1:8787/api/auth/me >/dev/null; then
                echo "API healthy"; break
              fi
              [ "$i" = 20 ] && {
                echo "API did not come up:" >&2
                systemctl status bookshelf-api --no-pager -l 2>&1 | tail -20 >&2
                exit 1
              }
              sleep 0.5
            done

            cd "$api_root/releases"
            live=$(basename "$(readlink -f "$api_root/current")")
            stale=$(ls -1dt */ | sed 's#/$##' | tail -n "+$((keep + 1))" | grep -vxF "$live" || true)
            if [ -n "$stale" ]; then printf '%s\n' "$stale" | xargs rm -rf --; fi
          REMOTE

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 https://sumanyuj.com/)
          echo "GET https://sumanyuj.com/ -> $code"
          [ "$code" = "200" ]

          api=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 https://sumanyuj.com/api/auth/me)
          echo "GET https://sumanyuj.com/api/auth/me -> $api"
          [ "$api" = "200" ]
